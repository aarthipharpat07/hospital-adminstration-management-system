<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicare | Doctors</title>

    <style>
        :root {
            --wine: #722F37;
            --dark-wine: #4E2027;
            --cream: #F7F3ED;
            --white: #FFFFFF;
            --text: #302528;
            --muted: #82767A;
            --border: #E8DCD6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--cream);
            color: var(--text);
        }

        .sidebar {
            width: 230px;
            min-height: 100vh;
            background: linear-gradient(180deg, var(--wine), var(--dark-wine));
            color: white;
            padding: 28px 18px;
            position: fixed;
            top: 0;
            left: 0;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 5px 0;
            border-radius: 8px;
            font-size: 14px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: rgba(255,255,255,0.16);
        }

        main {
            margin-left: 230px;
            padding: 35px;
        }

        .heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 30px;
            color: var(--wine);
            margin-bottom: 8px;
        }

        .muted {
            color: var(--muted);
            font-size: 14px;
        }

        button {
            background: var(--wine);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            cursor: pointer;
        }

        button:hover {
            background: var(--dark-wine);
        }

        .panel {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .panel h2 {
            font-size: 20px;
            margin-bottom: 18px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 14px;
            background: white;
        }

        .search {
            margin-bottom: 20px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            text-align: left;
            padding: 15px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
            background: var(--cream);
            color: var(--wine);
        }

        .delete-btn {
            background: #F1E4E6;
            color: var(--dark-wine);
            padding: 8px 12px;
        }

        #doctorForm {
            display: none;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 155px;
                padding: 18px 10px;
            }

            main {
                margin-left: 155px;
                padding: 18px;
            }

            .heading {
                align-items: flex-start;
                flex-direction: column;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
<link rel="stylesheet" href="css/animations.css">
</head>

<body>

    <aside class="sidebar">
        <div class="brand">✚ Medicare</div>
        <div class="subtitle">Hospital Management System</div>

        <a href="dashboard.html">Dashboard</a>
        <a href="patients.html">Patients</a>
        <a href="doctors.html" class="active">Doctors</a>
        <a href="appointments.html">Appointments</a>
        <a href="medicines.html">Medicines</a>
        <a href="billing.html">Billing</a>
        <a href="reports.html">Reports</a>
    </aside>

    <main>
        <div class="heading">
            <div>
                <h1>Doctor Management</h1>
                <p class="muted">Add, search and manage doctor records.</p>
            </div>
            <button onclick="toggleForm()">+ Add Doctor</button>
        </div>

        <section class="panel">
            <h2>Doctor Records</h2>

            <input
                class="search"
                id="search"
                type="text"
                placeholder="Search by doctor ID, name or specialization..."
                oninput="searchDoctors()"
            >

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Doctor ID</th>
                            <th>Name</th>
                            <th>Specialization</th>
                            <th>Experience</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                <tbody id="doctorRows">
                </tbody>
                   
                </table>
            </div>

            <form id="doctorForm" onsubmit="addDoctor(event)">
                <h2>Add New Doctor</h2>

                <input id="doctorId" placeholder="Doctor ID (e.g. D003)" required>
                <input id="doctorName" placeholder="Doctor name" required>
                <input id="specialization" placeholder="Specialization" required>
                <input id="experience" type="number" min="0" placeholder="Experience in years" required>

                <button type="submit">Save Doctor</button>
                <button type="button" class="delete-btn" onclick="toggleForm()">Cancel</button>
            </form>
        </section>
    </main>

    <script>
        async function loadDoctorsFromDatabase() {
    const rows = document.getElementById("doctorRows");

    try {
        const response = await fetch("http://localhost:3000/api/doctors");

        if (!response.ok) {
            throw new Error("Failed to load doctors");
        }

        const doctors = await response.json();
        rows.innerHTML = "";

        doctors.forEach(doctor => {
            const row = rows.insertRow();

            [
                doctor.Doctor_id,
                doctor.name,
                doctor.specialization,
                doctor.experience
            ].forEach(value => {
                row.insertCell().textContent = value ?? "";
            });

            const actionCell = row.insertCell();
            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";
            deleteButton.onclick = function () {
                deleteDoctor(this);
            };

            actionCell.appendChild(deleteButton);
        });

        searchDoctors();

    } catch (error) {
        console.error("Load doctors error:", error);
        alert("Could not load doctors. Check whether the backend is running.");
    }
}

loadDoctorsFromDatabase();
        function toggleForm() {
            const form = document.getElementById("doctorForm");
            form.style.display = form.style.display === "block" ? "none" : "block";
        }

      async function addDoctor(event) {
    event.preventDefault();

    const id = document.getElementById("doctorId").value.trim();
    const name = document.getElementById("doctorName").value.trim();
    const specialization = document.getElementById("specialization").value.trim();
    const experience = document.getElementById("experience").value;

    const rows = document.getElementById("doctorRows");

    const duplicate = [...rows.querySelectorAll("tr td:first-child")]
        .some(cell => cell.textContent.trim().toLowerCase() === id.toLowerCase());

    if (duplicate) {
        alert("This Doctor ID already exists.");
        return;
    }

    try {
        const response = await fetch("http://localhost:3000/api/doctors", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                Doctor_id: id,
                name: name,
                phone_number: "",
                specialization: specialization,
                experience: experience
            })
        });

        const resultText = await response.text();
console.log("Delete response:", resultText);

let result;

try {
    result = JSON.parse(resultText);
} catch {
    throw new Error("Backend JSON ke badle HTML bhej raha hai. Terminal check karo.");
}
        if (!response.ok || !result.success) {
            throw new Error(result.message || "Could not save doctor.");
        }

        alert("Doctor added successfully!");
        document.getElementById("doctorForm").reset();
        toggleForm();

        await loadDoctorsFromDatabase();
        searchDoctors();

    } catch (error) {
        console.error("Add doctor error:", error);
        alert(error.message || "Could not connect to the backend.");
    }
}

       async function deleteDoctor(button) {
    const row = button.closest("tr");
    const doctorId = row.cells[0].textContent.trim();

    if (!confirm("Delete this doctor record?")) {
        return;
    }

    try {
        const response = await fetch(
            `http://localhost:3000/api/doctors/${encodeURIComponent(doctorId)}`,
            { method: "DELETE" }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || "Could not delete doctor.");
        }

        alert("Doctor deleted successfully!");
        await loadDoctorsFromDatabase();
        searchDoctors();

    } catch (error) {
        console.error("Delete doctor error:", error);
        alert(error.message || "Backend connection failed.");
    }
}

        function searchDoctors() {
            const query = document.getElementById("search").value.toLowerCase();

            document.querySelectorAll("#doctorRows tr").forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(query)
                    ? ""
                    : "none";
            });
        }
    </script>

</body>
</html>
